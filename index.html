<!DOCTYPE html>
<html>
<head>
<title>OCR Test</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Paste screenshots or clipboard images to get OCR texts" />
<link href="https://fonts.googleapis.com/css?family=Inconsolata&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/6.0.1/tesseract.min.js" integrity="sha512-x3WuOingc6Q+P7pb4dV+MFLvfjIzTzk+e/HZwSdeIZ5VT5PEA67LMn60Tp3G7cj4pYVbdsPF0zjFqafDt/gOnA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
* {
  box-sizing: border-box;
}
body {
  font-family: 'Inconsolata', monospace;
  padding: 1rem;
  margin: 0;
}
h4 {
  margin: 0;
}

button {
  padding: 0.5rem;
}

.container {
  display: grid;
  grid-gap: 1rem;
}

/* single-column layout for mobile */
@media (max-width: 768px) {
  .container {
    grid-template-columns: 1fr;
  }
}

/* two-column layout for desktop */
@media (min-width: 768px) {
  .container {
    grid-template-columns: 1fr 1fr;
  }
}

#img-container {
  border: 1px solid #cccccc;
  min-height: 20rem;
}

#stat-container {
  overflow-y: scroll;
  border: 1px solid #cccccc;
  min-height: 20rem;
}

</style>
</head>
<body>
<h4>
  Tesseract OCR Utility
  <br/>
  <a target="_blank" href="https://github.com/mwdchang/ocr-tesseract">https://github.com/mwdchang/ocr-tesseract</a>
</h4>
<p> Paste images/clipboards here to extract text. or 
<button id="file-button"><label for="file-input">Upload file</label></button>
<input id="file-input" type="file" accept="image/*" capture="environment" style="display: none;"/>

or 
<button id="camera">Use camera</button>

</p>

<div class="container">
  <div id="img-container"></div>
  <div id="stat-container"></div>
</div>
</body>
<script type="module">

const imgContainer = document.getElementById('img-container');
const stat = document.getElementById('stat-container');

async function ocr(imgData) {

  const div = document.createElement('div');
  div.innerHTML = 'OCR working...';
  stat.appendChild(div);

  let { data : { text } } = await Tesseract.recognize(imgData, 'eng', {
    logger: msg => console.log(msg)
  })

  clear('stat-container');

  text = text.replaceAll(/\n/g, '<br>');

  div.innerHTML = text;
  stat.appendChild(div);
  stat.appendChild(document.createElement('hr'));
}

function clear(id) {
  const myNode = document.getElementById(id);
  while (myNode.firstChild) {
    myNode.removeChild(myNode.firstChild);
  }
}
  
// window.addEventListener('paste', ... or
document.onpaste = async (event) => {
  // use event.originalEvent.clipboard for newer chrome versions
  const items = (event.clipboardData  || event.originalEvent.clipboardData).items;
  // console.log(JSON.stringify(items)); // will give you the mime types

  // find pasted image among pasted items
  let blob = null;

  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf("image") === 0) {
      blob = items[i].getAsFile();
    }
  }
  // load image if there is a pasted image
  if (blob !== null) {
    const reader = new FileReader();
    reader.onload = async (event) => {
      // console.log(event.target.result); // data url!

      clear('img-container');
      clear('stat-container');

      const img = document.createElement('img');
      img.setAttribute('src', event.target.result);
      img.style.width = '100%';
      img.style.height = 'auto';
      document.getElementById('img-container').append(img);
      ocr(img.src);
    };
    reader.readAsDataURL(blob);
  }
}

const fileInput = document.getElementById('file-input');
fileInput.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      clear('img-container');
      clear('stat-container');

      const img = document.createElement('img');
      img.setAttribute('src', e.target.result);
      img.style.width = '100%';
      img.style.height = 'auto';
      document.getElementById('img-container').append(img);
      ocr(img.src);
    };
    reader.readAsDataURL(file);
  }
});

const cameraInput = document.getElementById('camera');
cameraInput.addEventListener('click', (event) => {
  takeWebcamPicture(640, 480, 600, 'environment').then(dataURL => {
    console.log("Captured image:", dataURL);

    // Display the image
    const img = document.createElement('img');
    img.src = dataURL;
    img.style.width = '100%';
    img.style.height = 'auto';
    document.getElementById('img-container').append(img);
    ocr(img.src);

    // document.body.appendChild(img);
  }).catch(err => {
    console.error("Failed to capture image:", err);
  });
});


async function takeWebcamPicture(
  width = 640,
  height = 480,
  delayMs = 500,
  facingMode = "environment"  // environment = back, user = front
) {
  try {
    const video = document.createElement('video');
    video.width = width;
    video.height = height;
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.style.display = 'none';
    document.body.appendChild(video);

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        width,
        height,
        facingMode: { ideal: facingMode }
      }
    });

    video.srcObject = stream;

    await new Promise(resolve => video.onloadedmetadata = resolve);
    await video.play();

    await new Promise(resolve => setTimeout(resolve, delayMs));

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(video, 0, 0, width, height);

    stream.getTracks().forEach(track => track.stop());
    video.remove();

    return canvas.toDataURL('image/png');
  } catch (err) {
    throw err;
  }
}
